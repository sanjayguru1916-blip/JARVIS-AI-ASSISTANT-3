name: Build Jarvis APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: unzip -o "Jarvis.Andriod.Zip.zip.zip" -d project

      - name: Fix project file names
        run: |
          cd project/JARVISVoiceAssistant

          mv .trashed-*-settings.gradle.kts settings.gradle.kts 2>/dev/null || true
          mv .trashed-*-gradle.properties gradle.properties 2>/dev/null || true
          mv .trashed-*-build.gradle.kts build.gradle.kts 2>/dev/null || true

          cd app
          mv .trashed-*-build.gradle.kts build.gradle.kts 2>/dev/null || true
          mv .trashed-*-proguard-rules.pro proguard-rules.pro 2>/dev/null || true

          mkdir -p src/main
          mv src/main/.trashed-*-AndroidManifest.xml src/main/AndroidManifest.xml 2>/dev/null || true

      - name: Check extracted files
        run: find project -maxdepth 4 -type f | head -50

      - name: Check Android source files
        run: find project/JARVISVoiceAssistant/app/src -type f

      - name: Check Android resources
        run: |
          echo "=== Resource folders ==="
          find project/JARVISVoiceAssistant/app/src/main/res -type f | sort

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        working-directory: project/JARVISVoiceAssistant
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-APK
          path: project/JARVISVoiceAssistant/app/build/outputs/apk/debug/app-debug.apk
