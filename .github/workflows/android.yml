name: Build Jarvis APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: unzip -o "Jarvis.Andriod.Zip.zip.zip" -d project

      - name: Fix project file names
        run: |
          cd project/JARVISVoiceAssistant

          mv .trashed-*-settings.gradle.kts settings.gradle.kts 2>/dev/null || true
          mv .trashed-*-gradle.properties gradle.properties 2>/dev/null || true
          mv .trashed-*-build.gradle.kts build.gradle.kts 2>/dev/null || true

          cd app
          mv .trashed-*-build.gradle.kts build.gradle.kts 2>/dev/null || true
          mv .trashed-*-proguard-rules.pro proguard-rules.pro 2>/dev/null || true

          mkdir -p src/main
          mv src/main/.trashed-*-AndroidManifest.xml src/main/AndroidManifest.xml 2>/dev/null || true
          find src/main/java -type f -name ".trashed-*-JarvisHudScreen.kt" -exec sh -c 'mv "$1" "$(dirname "$1")/JarvisHudScreen.kt"' _ {} \; 2>/dev/null || true

      - name: Fix Kotlin syntax comments
        run: |
          FILE=project/JARVISVoiceAssistant/app/src/main/java/com/sanjay/jarvis/ui/JarvisHudScreen.kt

          sed -i 's|^[^/]*Helmet center scan line|// Helmet center scan line|' "$FILE"
          sed -i 's|^[^/]*Chest armor center detail|// Chest armor center detail|' "$FILE"

      - name: Check extracted files
        run: find project -maxdepth 4 -type f | head -50

      - name: Check Android source files
        run: find project/JARVISVoiceAssistant/app/src -type f

      - name: Check Android resources
        run: |
          echo "=== Resource folders ==="
          find project/JARVISVoiceAssistant/app/src/main/res -type f | sort

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Create missing Android resources
        run: |
          RES=project/JARVISVoiceAssistant/app/src/main/res
          mkdir -p $RES/values
          mkdir -p $RES/mipmap

          cat > $RES/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">JARVIS Voice Assistant</string>
              <string name="whatsapp_listener_label">JARVIS WhatsApp Listener</string>
          </resources>
          EOF

          cat > $RES/values/themes.xml <<'EOF'
          <resources>
              <style name="Theme.JARVIS" parent="android:style/Theme.Material.NoActionBar" />
          </resources>
          EOF

          cat > $RES/mipmap/ic_launcher.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="48dp"
              android:height="48dp"
              android:viewportWidth="48"
              android:viewportHeight="48">
              <path
                  android:fillColor="#00BCD4"
                  android:pathData="M24,2A22,22 0,1 0,24,46A22,22 0,1 0,24,2" />
          </vector>
          EOF

          cp $RES/mipmap/ic_launcher.xml $RES/mipmap/ic_launcher_round.xml

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check Kotlin error lines
        run: |
          echo "=== Lines 480 to 490 ==="
          nl -ba project/JARVISVoiceAssistant/app/src/main/java/com/sanjay/jarvis/ui/JarvisHudScreen.kt | sed -n '480,490p'

          echo "=== Lines 560 to 570 ==="
          nl -ba project/JARVISVoiceAssistant/app/src/main/java/com/sanjay/jarvis/ui/JarvisHudScreen.kt | sed -n '560,570p'

      - name: Build Debug APK
        working-directory: project/JARVISVoiceAssistant
        run: gradle assembleDebug


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-APK
          path: project/JARVISVoiceAssistant/app/build/outputs/apk/debug/app-debug.apk
